apiVersion: 1

datasources:
  - name: Jira Development Logs
    uid: jira-dev-logs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      # The datasource expects a string here; the target uses a numeric override.
      maxLines: "10001"
