name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: docker compose --env-file /dev/null -p jira-panel-ci -f docker-compose.dev.yml up -d --wait
      - run: npm run seed
      - run: npm run test:e2e
      - if: always()
        run: docker compose --env-file /dev/null -p jira-panel-ci -f docker-compose.dev.yml down --volumes
